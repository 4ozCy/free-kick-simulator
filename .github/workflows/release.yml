name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the workflow can create the GitHub Release and attach the APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK + licences are preinstalled on ubuntu-latest (ANDROID_HOME is set)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # The key lives in repo secrets, never in the repo (it is a public repo).
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Add the repo secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS (Settings > Secrets and variables > Actions)."; exit 1; }
          mkdir -p ci && echo "$KEYSTORE_BASE64" | base64 -d > ci/release.jks

      - name: Physics self-check
        run: node --test test/physics.test.js

      - name: Build signed release APK
        working-directory: android
        env:
          RFK_KEYSTORE: ${{ github.workspace }}/ci/release.jks
          RFK_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RFK_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RFK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon -PrfkCode=${{ github.run_number }} -PrfkName=1.0.${{ github.run_number }} --stacktrace

      - name: Check the signature
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk)
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK"
          # fixed file name so the website's releases/latest/download/retro-freekick.apk link keeps working
          cp "$APK" retro-freekick.apk

      - name: Pack the PC version
        run: | # the same game as the browser version, offline: unzip and open index.html
          mkdir -p "pc/Retro Free Kick" && cp www/index.html www/game.js "pc/Retro Free Kick/"
          printf 'Retro Free Kick for PC\r\n\r\nOpen index.html in Chrome, Edge or Firefox. No install needed.\r\nMouse to aim and shoot. Space = kick, Esc = menu.\r\nVolume: Esc, then SOUND and MUSIC VOLUME.\r\n' > "pc/Retro Free Kick/README.txt"
          (cd pc && zip -qr ../retro-freekick-pc.zip "Retro Free Kick")

      # The APK is attached directly to the Release, so it downloads as a plain .apk, not a zip.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Retro Free Kick v1.0.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message || 'Manual build' }}

            Android: download retro-freekick.apk below and install it.
            PC: download retro-freekick-pc.zip, unzip it and open index.html (or play at https://retrofreekick.site/play/).
          files: |
            retro-freekick.apk
            retro-freekick-pc.zip
          make_latest: true
