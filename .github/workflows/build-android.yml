name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to publish releases on v* tags
    steps:
      - uses: actions/checkout@v4

      - name: Physics self-check
        run: node --test test/physics.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK + licences are preinstalled on ubuntu-latest (ANDROID_HOME is set)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Package the HTML5 build for itch.io
        run: cd www && zip -r ../retro-freekick-web.zip index.html game.js

      - uses: actions/upload-artifact@v4
        with:
          name: retro-freekick-web
          path: retro-freekick-web.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: retro-freekick
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The website's download button points at releases/latest/download/retro-freekick.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk retro-freekick.apk
          gh release create "$GITHUB_REF_NAME" retro-freekick.apk retro-freekick-web.zip \
            --title "Retro Free Kick $GITHUB_REF_NAME" --generate-notes
