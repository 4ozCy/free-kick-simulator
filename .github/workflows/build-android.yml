name: Build Android APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Physics self-check
        run: node --test test/physics.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK + licences are preinstalled on ubuntu-latest (ANDROID_HOME is set)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Package the HTML5 build for itch.io
        run: cd www && zip -r ../retro-freekick-web.zip index.html game.js

      - uses: actions/upload-artifact@v4
        with:
          name: retro-freekick-web
          path: retro-freekick-web.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: retro-freekick
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
