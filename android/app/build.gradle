plugins { id 'com.android.application' }

android {
    namespace 'com.retrofreekick'
    compileSdk 35
    defaultConfig {
        applicationId 'com.retrofreekick'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // the game itself lives in /www so the browser build and the APK share one copy
    sourceSets { main { assets.srcDirs = ['../../www'] } }
}
